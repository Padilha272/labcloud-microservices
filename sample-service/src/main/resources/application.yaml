spring:
  application:
    name: sample-service

  # Banco de dados
  datasource:
    url: jdbc:postgresql://localhost:5433/labcloud_sample
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true

  # JWT
  security:
    jwt:
      secret: chave-secreta-jwt-compartilhada-entre-todos-os-servicos-labcloud-2026-esta-e-a-chave
      expiration: 86400000

# SERVIDOR
server:
  port: 8082

# FEIGN CLIENT
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000

# URL DO AUTH SERVICE
services:
  auth:
    url: http://localhost:8081

# LOGGING
logging:
  level:
    com.labcloud: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG